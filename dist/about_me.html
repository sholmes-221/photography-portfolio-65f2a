<head>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'signika': ['Signika', 'sans-serif'],
            'cormorant': ['Cormorant Garamond', 'serif'],

  <style>
    body { opacity: 0; animation: fadeIn 0.6s ease forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    .medal-line {
      background: linear-gradient(90deg, #b8972a, #f0d060, #b8972a);
    }

    .gear-card {
      opacity: 0;
      transform: translateY(24px);
      animation: cardReveal 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes cardReveal { to { opacity: 1; transform: translateY(0); } }

    .photo-wrap {
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .gear-card:hover .photo-wrap {
      transform: translateY(-5px);
      box-shadow: 0 20px 44px rgba(0,0,0,0.16);
    }

    .thumb-img {
      transition: opacity 0.25s, transform 0.25s;
    }
    .thumb-img:hover {
      opacity: 0.85;
      transform: scale(1.04);
    }

    .more-badge {
      background: rgba(0,0,0,0.52);
      backdrop-filter: blur(2px);
    }
    @media (prefers-color-scheme: dark) {
      .photo-img { filter: brightness(0.88); }
      .more-badge { background: rgba(0,0,0,0.68); }
    }
  </style>
</head>

<body class="dark:bg-black bg-white text-black dark:text-white px-5 md:px-20 transition duration-500">

            <li class="group transition duration-300">

  <script>
    // ─────────────────────────────────────────────────────────────
    //  GEAR DATA
    //  Each entry has:
    //    images      – array of image URLs (one or more)
    //    name        – gear name (displayed prominently)
    //    category    – e.g. "机身", "镜头", "配件"
    //    description – a paragraph about the gear
    // ─────────────────────────────────────────────────────────────
    const gear = [
      {
        images: [
          "./assets/xt30.webp",
        ],
        name: "FUJIFILM X-T30 II",
        category: "机身",
        description: "富士的 APS-C 旗舰级机身，拥有出色的色彩表现和便携的机身设计。X-T30 II 的图像处理器和对焦系统让我能够轻松捕捉到每一个精彩瞬间，无论是人像还是街拍，都能呈现出细腻的画质和丰富的层次感",
      },
      {
        images: [
          "./assets/sigma1850.webp",
        ],
        name: "Sigma 18-50mm F2.8 DC DN",
        category: "镜头",
        description: "这支镜头是我最常用的伴侣，覆盖了从广角到标准焦段的实用范围。它的恒定 F2.8 大光圈让我在各种光线条件下都能拍摄出清晰锐利的照片，同时也能创造出迷人的背景虚化效果。无论是拍摄人像还是风景，这支镜头都能提供出色的图像质量和色彩表现",
      },
      {
        images: [
          "./assets/sigma56.webp",
        ],
        name: "Sigma 56mm F1.4 DC DN",
        category: "镜头",
        description: "这支镜头是我拍摄人像的秘密武器。它的 F1.4 大光圈能够创造出梦幻般的背景虚化效果，让主体更加突出。无论是在室内还是户外，这支镜头都能提供出色的图像质量和锐利的细节表现，让每一张人像照片都充满魅力",
      },
      {
        images: [
          "./assets/ccd.webp",
        ],
        name: "松下 CCD 相机 DMC-FX37",
        category: "机身",
        description: "2008 年买的一款 CCD 相机，日本制造，适合拍复古风，千禧风的照片",
      },
      {
        images: [
          "./assets/it32.webp",
        ],
        name: "神牛 iT32 闪光灯",
        category: "器材",
        description: "神牛 iT32 是一款功能强大的闪光灯，适用于各种摄影场景。它支持 TTL 自动曝光和手动模式，能够提供稳定的光输出和快速的回电时间。无论是在室内还是户外，这款闪光灯都能帮助我捕捉到清晰明亮的照片，尤其是在低光环境下表现出色",
      },
      {
        images: [
          "./assets/350.webp",
        ],
        name: "神牛 V350F 闪光灯",
        category: "器材",
        description: "神牛 V350F（Godox V350F） 是一款非常经典的富士机顶闪光灯，定位是轻量便携 + TTL自动 + 无线引闪 + 高速同步，很适合日常人像、扫街、人像补光和外拍使用",
      },
      {
        images: [
          "./assets/tt43.webp",
        ],
        name: "优篮子 tt43 三脚架",
        category: "器材",
        description: "优篮子 tt43 是一款轻量级的旅行三脚架，采用铝合金材质，提供稳定的支撑和便携的设计。它的快速释放板和多角度调节功能使得拍摄更加灵活，无论是在城市街头还是自然风光中，都能帮助我捕捉到清晰稳定的照片，最大高度约 190cm",
      },
      // 继续添加器材，格式如下：
      // {
      //   images: ["path/to/image.jpg"],
      //   name: "器材名称",
      //   category: "类别",
      //   description: "描述文字……",
      // },
    ];

    // ─────────────────────────────────────────────────────────────
    //  BUILD CARDS
    // ─────────────────────────────────────────────────────────────
    function buildGrid() {
      const grid = document.getElementById('gear-grid');
      const THUMB_SHOW = 4;

      gear.forEach((item, i) => {
        const galleryId = `gear-gallery-${i}`;
        const delay = `${i * 0.1 + 0.1}s`;
        const imgs = item.images;
        const primary = imgs[0];
        const extras = imgs.slice(1);

        // thumbnail strip
        let thumbStrip = '';
        if (extras.length > 0) {
          const visibleExtras = extras.slice(0, THUMB_SHOW - 1);
          const remaining = extras.length - visibleExtras.length;

          const thumbs = visibleExtras.map(src => `
            <a href="${src}" data-fancybox="${galleryId}"
               class="relative overflow-hidden rounded-sm flex-shrink-0 w-16 h-16 md:w-20 md:h-20 block">
              <img src="${src}" class="thumb-img photo-img w-full h-full object-cover object-center" alt="" />
            </a>
          `).join('');

          const lastSrc = extras[THUMB_SHOW - 1];
          const lastThumb = remaining > 0 && lastSrc ? `
            <a href="${lastSrc}" data-fancybox="${galleryId}"
               class="relative overflow-hidden rounded-sm flex-shrink-0 w-16 h-16 md:w-20 md:h-20 block">
              <img src="${lastSrc}" class="thumb-img photo-img w-full h-full object-cover object-center" alt="" />
              <div class="more-badge absolute inset-0 flex items-center justify-center text-white font-signika text-sm font-bold">
                +${remaining + 1}
              </div>
            </a>
          ` : '';

          const hiddenExtras = extras.slice(THUMB_SHOW).map(src => `
            <a href="${src}" data-fancybox="${galleryId}" class="hidden" aria-hidden="true"></a>
          `).join('');

          thumbStrip = `
            <div class="flex gap-2 mt-3 flex-wrap">
              ${thumbs}
              ${lastThumb}
              ${hiddenExtras}
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = 'gear-card';
        card.style.animationDelay = delay;

        card.innerHTML = `
          <div class="flex flex-col md:flex-row gap-0 mb-14 group">

            <!-- photo block -->
            <div class="flex flex-col shrink-0 w-full md:w-72 lg:w-80">
              <div class="photo-wrap overflow-hidden rounded-sm shadow-md">
                <a href="${primary}" data-fancybox="${galleryId}">
                  <img
                    src="${primary}"
                    alt="${item.name}"
                    class="photo-img w-full h-64 md:h-56 object-cover object-center transform scale-100 hover:scale-105 transition duration-500"
                  />
                </a>
              </div>
              ${thumbStrip}
            </div>

            <!-- info -->
            <div class="flex flex-col justify-between pt-4 md:pt-0 md:pl-8 flex-1">
              <div>
                <!-- category badge -->
                <span
                  class="inline-flex items-center px-3 py-1 rounded-sm text-xs font-signika font-bold tracking-widest uppercase mb-4 bg-gray-100 dark:bg-neutral-800 text-gray-500 dark:text-gray-400"
                  style="letter-spacing: 0.12em;">
                  ${item.category}
                </span>

                <!-- gear name -->
                <p class="font-signika text-xl md:text-2xl font-bold tracking-wide mb-3 leading-snug text-gray-500 dark:text-gray-400">
                  ${item.name}
                </p>

                <!-- description -->
                <p class="text-sm md:text-base text-gray-500 dark:text-gray-400 leading-relaxed max-w-prose">
                  ${item.description}
                </p>
              </div>

              <!-- gold divider -->
              <div class="medal-line h-px w-16 mt-6 opacity-50 hidden md:block"></div>
            </div>
          </div>

          <!-- mobile divider -->
          <div class="medal-line h-px w-full mb-14 mt-0 opacity-25 md:hidden"></div>
        `;

        grid.appendChild(card);
      });

      Fancybox.bind("[data-fancybox]", {});
    }

    buildGrid();
  </script>

  <script src="menu.js"></script>
</body>
