  <script>
    tailwind.config = {
      theme: {
        extend: {

  <style>
    body { opacity: 0; animation: fadeIn 0.6s ease forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    .award-badge {
      position: relative;
      overflow: hidden;
    }
    .award-badge::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.22) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.55s ease;
    }
    .award-card:hover .award-badge::after {
      transform: translateX(100%);
    }

    .photo-wrap {
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .award-card:hover .photo-wrap {
      transform: translateY(-5px);
      box-shadow: 0 20px 44px rgba(0,0,0,0.16);
    }

    .medal-line {
      background: linear-gradient(90deg, #b8972a, #f0d060, #b8972a);
    }

    .award-card {
      opacity: 0;
      transform: translateY(24px);
      animation: cardReveal 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes cardReveal { to { opacity: 1; transform: translateY(0); } }

    @media (prefers-color-scheme: dark) {
      .photo-img { filter: brightness(0.88); }
    }

    .award-number {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: #c9a83c;
      line-height: 1;
    }

    /* thumbnail strip */
    .thumb-img {
      transition: opacity 0.25s, transform 0.25s;
    }
    .thumb-img:hover {
      opacity: 0.85;
      transform: scale(1.04);
    }

    /* +N more badge */
    .more-badge {
      background: rgba(0,0,0,0.52);
      backdrop-filter: blur(2px);
    }
    @media (prefers-color-scheme: dark) {
      .more-badge { background: rgba(0,0,0,0.68); }
    }
  </style>
</head>

<body class="dark:bg-black bg-white text-black dark:text-white px-5 md:px-20 transition duration-500">

  <script>
    // ─────────────────────────────────────────────────────────────
    //  AWARD DATA
    //  Each entry has:
    //    images  – array of image URLs (one or more)
    //    award   – award name displayed on the badge
    //    year    – year string
    // ─────────────────────────────────────────────────────────────
    const awards = [
      {
        images: [
          "https://8d9f319.webp.li/20260627-DSCF8739.jpg",
          "https://8d9f319.webp.li/20260627-DSCF8701.jpg",
          "https://8d9f319.webp.li/20260627-DSCF8774.jpeg", 
          "https://8d9f319.webp.li/Screenshot%202026-07-02%20at%208.15.33%E2%80%AFPM.png",
        ],
        award: "入选 Blowup Magazine",
        year: "2026",
        description: "链接：https://blowupmag.com/photo/25136/, https://blowupmag.com/photo/25138/",
      },
      {
        images: [
          "https://8d9f319.webp.li/Bo%20Yi%20(1).jpg",
          "https://8d9f319.webp.li/Bo%20Yi%20(2).jpg",
          "https://8d9f319.webp.li/Bo%20Yi%20(3).jpg",
          "https://8d9f319.webp.li/Bo%20Yi%20(4).jpg",
        ],
        award: "入选 World Model Hunt Magazine July 2026",
        year: "2026",
        description: "链接：https://www.magcloud.com/browse/issue/3359579",
      },
      {
        images: [
          "https://8d9f319.webp.li/ROOSA%20Magazine%20June%202026%20Issue%204%20(50).jpeg",
          "https://8d9f319.webp.li/ROOSA%20Magazine%20June%202026%20Issue%204%20(51).jpeg",
          "https://8d9f319.webp.li/ROOSA%20Magazine%20June%202026%20Issue%204%20(44).jpeg",
          "https://8d9f319.webp.li/ROOSA%20Magazine%20June%202026%20Issue%204%20(45).jpeg",
          "https://8d9f319.webp.li/ROOSA%20Magazine%20June%202026%20Issue%203%20(41).jpeg",
          "https://8d9f319.webp.li/ROOSA%20Magazine%20June%202026%20Issue%203%20(40).jpg",
          "https://8d9f319.webp.li/ROOSA%20Magazine%20June%202026%20Issue%203%20(39).jpeg",
          "https://8d9f319.webp.li/ROOSA%20Magazine%20June%202026%20Issue%203%20(38).jpeg",
          "https://8d9f319.webp.li/roosa_mag_june_issue_3.jpg",
          "https://8d9f319.webp.li/roosa_june.png",
        ],
        award: "入选 ROOSA Magazine June Issue",
        year: "2026",
        description: "链接：https://www.magcloud.com/browse/issue/3354080, https://www.magcloud.com/browse/issue/3354082",
      },
      {
        images: [
          "https://8d9f319.webp.li/IMG_3601.JPG",
          "https://8d9f319.webp.li/IMG_3602.JPG",
          "https://8d9f319.webp.li/IMG_3603.JPG",
        ],
        award: "入选 PhotoVogue",
        year: "2025",
        description: "链接：https://www.vogue.com/photovogue/photographers/405110/gallery#5565927",
      },
      {
        images: [
          "https://8d9f319.webp.li/IMG_3679.jpg",
          "https://8d9f319.webp.li/IMG_3680.jpg",
          "https://8d9f319.webp.li/IMG_3677.jpg",
          "https://8d9f319.webp.li/IMG_3678.jpg",
        ],
        award: "入选 The Momento",
        year: "2025",
        description: "链接：https://themomento.co.uk/",
      },
      // Add more awards below, for example:
      // {
      //   images: [
      //     "path/to/photo1.jpg",
      //     "path/to/photo2.jpg",
      //     "path/to/photo3.jpg",
      //   ],
      //   award: "Gold Award — Portrait",
      //   year: "2023",
      // },
    ];

    // ─────────────────────────────────────────────────────────────
    //  BUILD CARDS
    // ─────────────────────────────────────────────────────────────
    function buildGrid() {
      const grid = document.getElementById('awards-grid');
      const THUMB_SHOW = 4; // max thumbnails shown before "+N more"

      awards.forEach((item, i) => {
        const galleryId = `award-gallery-${i}`;
        const delay = `${i * 0.1 + 0.1}s`;
        const imgs = item.images;
        const primary = imgs[0];
        const extras = imgs.slice(1);

        // Build hidden fancybox links for all images (gallery group)
        const hiddenLinks = imgs.map((src, j) => `
          <a href="${src}" data-fancybox="${galleryId}" class="${j === 0 ? '' : 'hidden'}" aria-hidden="${j === 0 ? 'false' : 'true'}"></a>
        `).join('');

        // Build thumbnail strip (shown only when extras exist)
        let thumbStrip = '';
        if (extras.length > 0) {
          const visibleExtras = extras.slice(0, THUMB_SHOW - 1);
          const remaining = extras.length - visibleExtras.length;

          const thumbs = visibleExtras.map((src, j) => `
            <a href="${src}" data-fancybox="${galleryId}"
               class="relative overflow-hidden rounded-sm flex-shrink-0 w-16 h-16 md:w-20 md:h-20 block">
              <img src="${src}" class="thumb-img photo-img w-full h-full object-cover object-center" alt="" />
            </a>
          `).join('');

          // last thumb: show "+N" overlay if there are remaining
          const lastSrc = extras[THUMB_SHOW - 1];
          const lastThumb = remaining > 0 && lastSrc ? `
            <a href="${lastSrc}" data-fancybox="${galleryId}"
               class="relative overflow-hidden rounded-sm flex-shrink-0 w-16 h-16 md:w-20 md:h-20 block">
              <img src="${lastSrc}" class="thumb-img photo-img w-full h-full object-cover object-center" alt="" />
              <div class="more-badge absolute inset-0 flex items-center justify-center text-white font-signika text-sm font-bold">
                +${remaining + 1}
              </div>
            </a>
          ` : '';

          // Register hidden anchors for remaining extras beyond THUMB_SHOW
          const hiddenExtras = extras.slice(THUMB_SHOW).map(src => `
            <a href="${src}" data-fancybox="${galleryId}" class="hidden" aria-hidden="true"></a>
          `).join('');

          thumbStrip = `
            <div class="flex gap-2 mt-3 flex-wrap">
              ${thumbs}
              ${lastThumb}
              ${hiddenExtras}
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = 'award-card';
        card.style.animationDelay = delay;

        card.innerHTML = `
          <div class="flex flex-col md:flex-row gap-0 mb-14 group">

            <!-- photo block -->
            <div class="flex flex-col shrink-0 w-full md:w-72 lg:w-80">
              <!-- primary image -->
              <div class="photo-wrap overflow-hidden rounded-sm shadow-md">
                <a href="${primary}" data-fancybox="${galleryId}">
                  <img
                    src="${primary}"
                    alt="${item.award}"
                    class="photo-img w-full h-64 md:h-56 object-cover object-center transform scale-100 hover:scale-105 transition duration-500"
                  />
                </a>
              </div>
              <!-- thumbnail strip -->
              ${thumbStrip}
              <!-- hidden anchors for all gallery images -->
              <div class="hidden">${hiddenLinks}</div>
            </div>

            <!-- info -->
            <div class="flex flex-col justify-between pt-4 md:pt-0 md:pl-8 flex-1">
              <div>
                <!-- year badge -->
                <span
                  class="inline-flex items-center px-3 py-1 rounded-sm text-xs font-signika font-bold tracking-widest uppercase mb-4 bg-gray-100 dark:bg-neutral-800 text-gray-500 dark:text-gray-400"
                  style="letter-spacing: 0.12em;">
                  ${item.year}
                </span>

                <!-- award name -->
                <p class="font-signika text-xl md:text-2xl font-bold tracking-wide mb-1 leading-snug text-gray-500 dark:text-gray-400">
                  ${item.award}
                </p>

                <!-- description -->
                ${item.description ? `<p class="text-sm text-gray-500 dark:text-gray-400 mt-2">${item.description}</p>` : ''}

                <!-- image count hint -->
                <p class="text-sm text-gray-400 dark:text-gray-500 mt-2 font-cormorant italic">
                  ${imgs.length} ${imgs.length === 1 ? 'photograph' : 'photographs'}
                </p>
              </div>

              <!-- gold divider -->
              <div class="medal-line h-px w-16 mt-6 opacity-50 hidden md:block"></div>
            </div>
          </div>

          <!-- mobile divider -->
          <div class="medal-line h-px w-full mb-14 mt-0 opacity-25 md:hidden"></div>
        `;

        grid.appendChild(card);
      });

      Fancybox.bind("[data-fancybox]", {});
    }

    buildGrid();
  </script>

  <script src="../dist/menu.js"></script>
